# CodeOps — single-service deployment (Express API + Better Auth + built SPA on one origin).
# Recommended over a Vercel split: one origin means same-site auth cookies and no CORS setup.
#
# Database: Render has no managed MySQL, so DATABASE_URL must point at an external
# MySQL-compatible host (PlanetScale, TiDB Cloud, Aiven, Railway, or self-hosted MySQL 8).
# db:migrate runs automatically before each deploy against DATABASE_URL.

services:
  - type: web
    name: codeops
    runtime: node
    plan: free
    buildCommand: pnpm build
    startCommand: pnpm start
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (secret)
      - key: BETTER_AUTH_SECRET
        sync: false # set in the Render dashboard (secret) — openssl rand -base64 32
      - key: BETTER_AUTH_URL
        sync: false # set to this service's URL, e.g. https://codeops.onrender.com
      # Optional — only when the SPA is hosted separately (Vercel split, see
      # README). CLIENT_ORIGIN enables credentialed CORS + SameSite=None
      # cookies + trusted origins for the SPA origin(s); GitHub OAuth callback
      # redirects then land back on the first origin in the list.
      - key: CLIENT_ORIGIN
        sync: false
      - key: BETTER_AUTH_TRUSTED_ORIGINS
        sync: false
      # Optional — social sign-in:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
